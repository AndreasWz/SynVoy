name: synvoy_env
channels:
  - conda-forge
  - bioconda
  # 'defaults' deliberately omitted: since 2024 Anaconda's defaults channel
  # requires ToS acceptance and aborts non-interactive `conda env create` with
  # CondaToSNonInteractiveError. All deps below resolve from conda-forge +
  # bioconda. 'nodefaults' also blocks a user's global .condarc from re-adding it.
  - nodefaults
dependencies:
  # Core
  # Python 3.13 removed stdlib cgi, which ete3 still imports.
  - python >=3.10,<3.13
  # Nextflow 24.11+ requires Java 17+. Keep Java in the env so `mamba run`
  # works even when the login shell has no system Java.
  - openjdk >=17,<26
  - nextflow >=25.10.0

  # Bioinformatics tools
  - mmseqs2 >=14.7e284
  - blast >=2.13.0        # tblastn / makeblastdb
  - prodigal >=2.6.3      # prokaryotic gene prediction (fallback)
  - augustus >=3.4.0       # eukaryotic gene prediction (default)
  - mafft >=7.505
  - miniprot
  - samtools >=1.15        # samtools faidx — strong-synteny / GOI-hull rescue windows
  - iqtree >=2.2.0         # binary may be `iqtree2` or `iqtree` depending on package version

  # Genome fetching (easy mode)
  - ncbi-datasets-cli
  - entrez-direct

  # Python packages
  - biopython
  - plotly >=5.0.0
  - ete3                  # tree I/O in plot_synteny & phylo_sort
  - taxopy >=0.11.0       # phylogenetic sorting
  - parasail-python       # Smith-Waterman via parasail (GOI search)
  - numpy
  - psutil                # system resource detection for LLM model selection

  # Utilities
  - unzip

  # Optional ML search layers (off by default):
  #   --enable_plm_search true        (ProtT5 embedding search)
  #   --enable_structural_search true (ESMFold + Foldseek structural search)
  # These deps (torch + CUDA, transformers, sentencepiece, foldseek) are large
  # and GPU/driver-specific, so they live in a separate overlay rather than here.
  # Install on top of an existing env when you want them:
  #   mamba env update -n synvoy_env -f environment-ml.yml
  # See environment-ml.yml (LRZ AI Systems / GPU notes) and the `lrz_ai` profile
  # in nextflow.config. ESMFold needs a GPU with >=8 GB VRAM for ~400 aa proteins.
