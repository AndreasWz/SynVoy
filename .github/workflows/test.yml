name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` — that requires a requirements.txt/pyproject.toml
          # to derive a cache key, and we install inline (3 small wheels)
          # below. Pip caching is not worth the friction for ~10 s of installs.

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimum set for tests/ — bioinformatics CLIs (mmseqs2, blast+,
          # miniprot, augustus, etc.) are not exercised by pytest, so we skip
          # the heavy conda env here. Keeps CI under a minute.
          pip install pytest biopython parasail

      - name: Run pytest
        # NOTE: tests/benchmark_truth/ is gitignored (unpublished curated coordinates),
        # so the §1y coordinate-freeze cases in tests/test_coordinate_benchmark.py SKIP
        # here and only their scoring logic is exercised. A green run on this workflow
        # is NOT evidence that the ant-melittin coordinate regression is still caught.
        # To gate on it, run somewhere the truth table exists with:
        #     SYNVOY_REQUIRE_TRUTH=1 pytest tests/test_coordinate_benchmark.py
        # which turns the skips into failures.
        run: |
          pytest tests/ -v --tb=short --durations=10

      - name: Upload pytest cache on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache-py${{ matrix.python-version }}
          path: .pytest_cache/
          retention-days: 7
