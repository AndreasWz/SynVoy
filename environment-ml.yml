# environment-ml.yml: SynVoy's environment with the packages of the experimental search steps
# (ProtT5 embedding search, ESMFold + Foldseek structural search; both off by default).
#
# It holds every package of environment.yml, with the same versions (tests/test_conda_environments.py
# keeps the two lists equal), and the ML packages below them. These are large (torch + CUDA) and
# GPU/driver-specific, so environment.yml does not hold them.
#
# Under a conda profile (standard, auto, low_mem, laptop_safe, conda, hpc_conda, lrz_ai) Nextflow
# builds the steps' environment from this file instead of environment.yml when a run sets
#     --enable_plm_search true   and/or   --enable_structural_search true
# (nextflow.config, process.conda). Nothing has to be installed by hand for that.
#
# To have the packages in synvoy_env too (to run the scripts in bin/ yourself):
#     mamba env update -n synvoy_env -f environment-ml.yml
#
# On LRZ AI Systems (GPU): conda-forge resolves a CUDA-enabled pytorch build
# automatically when a GPU + CUDA runtime are visible at solve time. If you end
# up with a CPU-only build, pin it on a node that can see the GPU:
#     mamba install -n synvoy_env -c conda-forge 'pytorch=*=*cuda*'
# Verify with:
#     python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#
# Model weights are auto-downloaded from HuggingFace on first use:
#   - ProtT5  : Rostlab/prot_t5_xl_half_uniref50-enc  (~2.5 GB)
#   - ESMFold : facebook/esmfold_v1                    (~2.8 GB)
# Point HF_HOME at scratch/project storage so they don't fill $HOME:
#     export HF_HOME=$SCRATCH/hf_cache
name: synvoy_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # The packages of environment.yml (see the comments there)
  - python ==3.12.13
  - openjdk >=17,<26
  - nextflow ==26.04.3
  - mmseqs2 ==18.8cc5c
  - blast ==2.17.0
  - prodigal ==2.6.3
  - augustus ==3.5.0
  - mafft ==7.526
  - miniprot ==0.18
  - samtools ==1.23
  - iqtree ==3.1.2
  - ncbi-datasets-cli ==18.30.1
  - entrez-direct
  - ete3
  - parasail-python ==1.3.4
  - numpy
  - unzip

  # The ML search steps
  - foldseek >=9          # structural search (3Di structural alphabet)
  - pytorch >=2.0         # ESMFold + ProtT5 inference
  - transformers >=4.30   # EsmForProteinFolding + T5EncoderModel
  - sentencepiece         # ProtT5 tokenizer (SentencePiece model)
  - protobuf              # required by transformers to convert the ProtT5
                          #   SentencePiece tokenizer to fast format; without
                          #   it T5Tokenizer.from_pretrained() aborts with
                          #   "SentencePieceExtractor requires the protobuf library"
  - pip
