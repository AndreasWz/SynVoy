# environment-ml.yml — optional ML overlay for SynVoy's experimental search layers
# (PLM embedding search + ESMFold/Foldseek structural search).
#
# These deps are deliberately NOT in environment.yml: they are large (torch +
# CUDA), GPU/driver-specific, and the features are OFF by default. Install them
# on top of an existing synvoy_env only when you intend to run with
#     --enable_plm_search true   and/or   --enable_structural_search true
#
# Install into the existing env (recommended):
#     mamba env update -n synvoy_env -f environment-ml.yml
#
# On LRZ AI Systems (GPU): conda-forge resolves a CUDA-enabled pytorch build
# automatically when a GPU + CUDA runtime are visible at solve time. If you end
# up with a CPU-only build, pin it on a node that can see the GPU:
#     mamba install -n synvoy_env -c conda-forge 'pytorch=*=*cuda*'
# Verify with:
#     python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#
# Model weights are auto-downloaded from HuggingFace on first use:
#   - ProtT5  : Rostlab/prot_t5_xl_half_uniref50-enc  (~2.5 GB)
#   - ESMFold : facebook/esmfold_v1                    (~2.8 GB)
# Point HF_HOME at scratch/project storage so they don't fill $HOME:
#     export HF_HOME=$SCRATCH/hf_cache
name: synvoy_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - foldseek >=9          # structural search (3Di structural alphabet)
  - pytorch >=2.0         # ESMFold + ProtT5 inference
  - transformers >=4.30   # EsmForProteinFolding + T5EncoderModel
  - sentencepiece         # ProtT5 tokenizer (SentencePiece model)
  - protobuf              # required by transformers to convert the ProtT5
                          #   SentencePiece tokenizer to fast format; without
                          #   it T5Tokenizer.from_pretrained() aborts with
                          #   "SentencePieceExtractor requires the protobuf library"
  - pip
